name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags: '*'
  workflow_dispatch:

# needed for julia-actions/cache to delete old caches
permissions:
  actions: write
  contents: read

# cancel superseded in-progress runs on the same ref, but never on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.shard.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    # a failing prerelease must not turn the CI badge red
    continue-on-error: ${{ matrix.version == 'pre' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
          - 'pre'
        os:
          - ubuntu-latest
        # Two shards of about equal test time (per-file times of a Julia 1 run). Shard `a` lists
        # the heaviest files; shard `b` excludes them, so a new test file lands in `b`.
        shard:
          - name: a
            args: 'models/inception models/sam3 models/vit models/densenet models/mobilenetv3 models/efficientnet models/z_image hub/initialization'
          - name: b
            args: '!models/inception !models/sam3 !models/vit !models/densenet !models/mobilenetv3 !models/efficientnet !models/z_image !hub/initialization'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # coverage from one version is enough; it slows the other legs down
          coverage: ${{ matrix.version == '1' }}
          test_args: ${{ matrix.shard.args }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1'
      - uses: codecov/codecov-action@v7
        if: matrix.version == '1'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # deploydocs pushes to gh-pages (contents) and reports the deployment (statuses)
    permissions:
      actions: write
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
